org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Pin the Gradle daemon to Android Studio's bundled JBR — the same JVM
# `flutter build` picks — so the CLI, a bare ./gradlew and the IDE all share one
# daemon instead of spawning a second one per JVM. Update if Studio moves.
org.gradle.java.home=/home/itamar/apps/android-studio/jbr
# Must stay `false` while any plugin still applies `kotlin-android` itself:
# with built-in Kotlin on, AGP 9 hard-fails such projects ("the plugin is no
# longer required for Kotlin support since AGP 9.0"). flutter_foreground_task
# 10.0.0 is currently one of them. With it off, Flutter auto-applies KGP to the
# subprojects that need it, including :app (which is why app/build.gradle.kts
# no longer declares `kotlin-android` and still compiles MainActivity.kt).
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
