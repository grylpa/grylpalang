org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# No `org.gradle.java.home` here, deliberately. Pointing Gradle at Android
# Studio's bundled JBR — the same JVM `flutter build` picks — is worth doing, so
# that the CLI, a bare ./gradlew and the IDE all compile against one toolchain
# rather than whichever JDK each happens to find. But the value is an absolute
# path into one machine's Studio install, useless in every other clone, so it
# belongs in a file git never sees: put `org.gradle.java.home=<studio>/jbr` in
# ~/.gradle/gradle.properties instead. That is user-level, so it covers every
# Gradle build on the machine, and this file's own settings still win wherever
# the two name the same key.
#
# It buys a shared *toolchain*, not a shared daemon: whether a daemon is reused
# between builds is `org.gradle.daemon`, which is a separate decision and is a
# per-machine one — on a machine short of RAM, leaving a daemon alive that this
# file allows to grow to 8G is the wrong trade, and turning it off costs only
# some start-up time per build.

# Must stay `false` while any plugin still applies `kotlin-android` itself:
# with built-in Kotlin on, AGP 9 hard-fails such projects ("the plugin is no
# longer required for Kotlin support since AGP 9.0"). flutter_foreground_task
# 10.0.0 is currently one of them. With it off, Flutter auto-applies KGP to the
# subprojects that need it, including :app (which is why app/build.gradle.kts
# no longer declares `kotlin-android` and still compiles MainActivity.kt).
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
